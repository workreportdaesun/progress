<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, user-scalable=yes, maximum-scale=5">
  <title>공정관리</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- 공정관리는 현장관리자 이상. 작업자(worker)는 출퇴근체크로 돌려보낸다. -->
<script src="/report/role-gate.js" data-require="manager"></script>
<!-- ?embed=1 이면 다른 앱(인원투입계획/실투입) 탭 안의 iframe이다 — 자기 헤더·PIN·플로팅
     이동 버튼을 띄우지 않는다. 주소로 직접 열면 지금까지와 똑같이 동작한다. -->
<script>if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
  <style>
    /* 예전 다크테마로 복귀. 헤더는 --hdr-1/--hdr-2 별도 변수로 고정해서 작업일보(report)와 같은
       남색 그라디언트를 그대로 유지 — 나머지 화면만 다크테마로 되돌림 */
    :root{--bg:#F0F4F8;--sf:#ffffff;--sf2:#F7FAFC;--bd:#D1DCE8;--bd2:#E6EDF5;--tx:#1A2332;--tx2:#5A7A9A;--head-bg:#DCE6F2;--fbd:#C8D8E8;--ac:#2E5F9E;--ac2:#1E3A5F;--ok:#1B7A43;--ok-bg:#EAF6EF;--err:#C0392B;--err-bg:#FDEDEC;--hdr-1:#1E3A5F;--hdr-2:#2E5F9E;--r:6px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html{overflow-y:scroll;}
    html.embed{overflow-y:auto;}   /* 삽입 모드에선 필요할 때만 스크롤바 */
    body{background:var(--bg);color:var(--tx);font-family:'Malgun Gothic',-apple-system,sans-serif;font-size:13px;min-height:100vh;}

    /* Header — 작업일보(report) 앱과 같은 진한 남색 그라디언트로 통일, 글자색은 어두운 배경에 맞춰 조정 */
    header{background:linear-gradient(135deg,var(--hdr-1),var(--hdr-2));border-bottom:none;padding:0 16px;position:sticky;top:0;z-index:200;}
    .hdr{display:flex;align-items:center;gap:8px;height:48px;width:100%;color:#fff;}
    .hdr-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
    .hdr-title img{width:28px;height:28px;border-radius:6px;}
    .hdr-title small{font-size:11px;color:rgba(255,255,255,0.65);font-weight:400;margin-left:6px;}
    .flex1{flex:1;}
    header .btn{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);color:#fff;}
    header .btn:hover{background:rgba(255,255,255,0.22);}
    header .btn-primary{box-shadow:0 0 0 1px rgba(255,255,255,0.35);}

    /* 탭바 — 헤더(남색)와 분리된 두 번째 행. 탭/버튼이 많아 한 줄에 다 안 들어가던 문제를 해결 */
    .tab-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:48px;z-index:190;}
    .tab-nav{display:flex;gap:2px;}
    .tab-btn{padding:5px 14px;border-radius:var(--r);border:1px solid var(--bd);background:var(--bg);color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
    .tab-btn:hover{border-color:var(--ac);color:var(--tx);}
    .tab-btn.on{background:var(--ac);border-color:var(--ac);color:#fff;}
    .hdr-sep{width:1px;height:22px;background:var(--bd);}

    /* Buttons */
    /* 버튼 서식은 인원투입계획/실투입 앱의 .btn.sm.ghost와 동일하게 맞춤(2026-08-11 통일) */
    .btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid var(--fbd);background:var(--sf2);color:var(--ac);font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap;}
    .btn:hover{background:var(--bd2);}
    .btn-primary{background:var(--ac);border-color:var(--ac);color:#fff;}
    .btn-primary:hover{background:var(--ac2);border-color:var(--ac2);}
    .btn-green{background:var(--ok);border-color:var(--ok);color:#fff;}
    .btn-green:hover{background:#15653A;}
    .btn-sm{padding:3px 8px;font-size:11px;}
    .file-inp{display:none;}

    /* 삽입(embed) 모드 — 바깥 앱 탭 안이라 자기 헤더는 빼고, 탭바를 맨 위로 올린다.
       배경은 투명하게 두어 바깥 카드 색을 그대로 쓴다. */
    html.embed body{background:transparent;}
    html.embed header{display:none;}
    html.embed .tab-bar{top:0;}
    /* 공정률/CHECK LIST 전환은 바깥 앱의 탭이 대신하므로 자체 탭 버튼은 감춘다.
       같은 줄의 CSV·새로고침 같은 동작 버튼들은 그대로 둔다. */
    html.embed .tab-nav{display:none;}
    html.embed .page{padding:0;}   /* 바깥 카드가 이미 여백을 준다 */

    /* Pages */
    /* PC 전용 화면 — 가로 폭 제한 없이 모니터 전체를 쓴다 (기존 1400px 상한 제거) */
    .page{width:100%;padding:16px;}
    .page.hidden{display:none;}

    /* Controls */
    /* 컨트롤 줄은 상자 없이 나열한다 — 인원투입계획/실투입 앱의 .toolbar와 같은 모양(2026-08-11) */
    .ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
    .ctrl-sep{width:1px;height:18px;background:var(--bd);margin:0 2px;}
    .ctrl-lbl{font-size:12px;font-weight:700;color:var(--tx2);white-space:nowrap;}
    .date-inp{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:13px;padding:6px 8px;font-family:inherit;}
    .date-inp:focus{outline:none;border-color:var(--ac2);}
    .import-status{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:4px;}
    #syncRefreshBtn.spin i{display:inline-block;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* Proc table */
    .tbl-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;table-layout:fixed;}
    td,th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    thead th{background:var(--head-bg);color:var(--tx);font-size:12px;font-weight:700;padding:8px 10px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap;}
    thead th.lft{text-align:left;}
    tbody tr{border-bottom:1px solid var(--bd2);transition:background .1s;}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:var(--sf2);}
    td{padding:7px 10px;font-size:12px;text-align:center;vertical-align:middle;}
    td.lft{text-align:left;font-weight:500;}
    td.unit{color:var(--tx2);font-size:11px;}
    tfoot td{background:var(--head-bg);font-weight:700;font-size:12px;border-top:1px solid var(--bd);padding:8px 10px;text-align:center;}
    input[type=number]{appearance:textfield;-moz-appearance:textfield;}
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .plan-inp{width:72px;background:var(--sf2);border:1px solid var(--bd);border-radius:4px;color:var(--tx);font-size:12px;padding:3px 6px;text-align:right;font-family:inherit;}
    .plan-inp:focus{outline:none;border-color:var(--ac2);}
    .plan-inp.locked{background:transparent;border-color:transparent;color:var(--tx2);cursor:default;pointer-events:none;}
    .lock-icon{font-size:10px;color:var(--tx2);cursor:pointer;margin-left:2px;vertical-align:middle;}
    .lock-icon:hover{color:var(--tx);}
    .factor-inp{width:52px;background:var(--sf2);border:1px solid var(--bd);border-radius:4px;color:var(--tx);font-size:12px;padding:3px 6px;text-align:center;font-family:inherit;}
    .factor-inp:focus{outline:none;border-color:var(--ac2);}
    .pbar-wrap{display:flex;align-items:center;gap:6px;}
    .pbar{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden;min-width:36px;}
    .pbar-fill{height:100%;border-radius:3px;transition:width .4s;}
    .pct-val{font-size:11px;font-weight:600;min-width:38px;text-align:right;white-space:nowrap;}

    /* Check List */
    /* 상단 컨트롤 줄 — 공정률 탭의 .ctrl과 같은 상자 서식(2026-08-11 통일) */
    .cs-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
    .cs-search{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:13px;padding:6px 8px;font-family:inherit;width:200px;}
    .cs-search:focus{outline:none;border-color:var(--ac2);}
    .cs-tag-inp{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:13px;padding:6px 8px;font-family:inherit;width:160px;}
    .cs-tag-inp:focus{outline:none;border-color:var(--ac2);}
    .cs-select{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:13px;padding:6px 8px;font-family:inherit;cursor:pointer;max-width:160px;}
    .cs-select:focus{outline:none;border-color:var(--ac2);}

    /* Virtual scroll */
    .cs-wrap{border:1px solid var(--bd);border-radius:8px;overflow:auto;background:var(--sf);position:relative;}
    .cs-hdr{display:flex;position:sticky;top:0;z-index:20;background:var(--head-bg);border-bottom:2px solid var(--bd);min-width:max-content;}
    /* 열 이름은 작업일보 설정에서 오므로 ABBR에 없는 긴 이름이 들어올 수 있다 — 칸을 넘치지 않게 자른다(전체 이름은 title 툴팁). */
    .cs-hdr-cell{flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx);padding:6px 4px;border-right:1px solid var(--bd2);height:36px;white-space:nowrap;overflow:hidden;}
    .cs-hdr-cell.lft{justify-content:flex-start;padding-left:8px;}
    .cs-virtual{position:relative;}
    .cs-row{display:flex;align-items:center;border-bottom:1px solid var(--bd2);min-width:max-content;height:36px;}
    .cs-row:hover{background:var(--sf2);}
    .cs-row:hover .cs-col-tag{background:var(--sf2);}
    .cs-col-tag{width:130px;min-width:130px;flex-shrink:0;position:sticky;left:0;z-index:5;background:var(--sf);border-right:2px solid var(--bd);font-size:12px;font-weight:600;padding:0 8px;height:36px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cs-hdr .cs-col-tag{background:var(--head-bg);z-index:25;}
    .cs-col-item{width:88px;min-width:88px;flex-shrink:0;border-right:1px solid var(--bd2);height:36px;display:flex;align-items:center;justify-content:center;position:relative;}
    .cs-col-item.has-val{background:var(--ok-bg);}
    .cs-qty-txt{color:var(--ok);font-size:12px;font-weight:600;}
    .cs-qty-inp{width:76px;background:transparent;border:none;color:var(--ok);font-size:12px;font-weight:600;text-align:center;font-family:inherit;padding:2px 4px;}
    .cs-qty-inp:focus{outline:1px solid var(--ac2);border-radius:3px;background:var(--sf2);}
    .cs-col-note{width:110px;min-width:110px;flex-shrink:0;border-right:1px solid var(--bd2);height:36px;display:flex;align-items:center;padding:0 4px;}
    .cs-note-inp{width:100%;background:transparent;border:none;color:var(--tx2);font-size:11px;font-family:inherit;padding:2px 4px;}
    .cs-note-inp:focus{outline:1px solid var(--bd);border-radius:3px;color:var(--tx);}
    .cs-col-del{width:72px;min-width:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;height:36px;gap:2px;}
    .cs-del-btn{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:14px;padding:3px 6px;border-radius:4px;}
    .cs-del-btn:hover{background:var(--err-bg);color:var(--err);}
    .cs-edit-btn{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:14px;padding:3px 6px;border-radius:4px;}
    .cs-edit-btn:hover{background:var(--sf2);color:var(--ac2);}
    .cs-tag-edit-inp{width:118px;background:var(--sf2);border:1px solid var(--ac2);border-radius:4px;color:var(--tx);font-size:12px;font-weight:600;padding:2px 6px;font-family:inherit;}
    .cs-tag-edit-inp:focus{outline:none;}

    /* 작업물량 */
    .wv-inp{width:100%;background:transparent;border:none;color:var(--tx);font-size:12px;font-family:inherit;padding:3px 6px;text-align:right;}
    .wv-inp:focus{outline:1px solid var(--ac2);border-radius:3px;background:var(--sf2);}
    .wv-inp.lft{text-align:left;}
    .wv-num{color:var(--ac2);font-weight:600;font-size:12px;}
    .wv-del-btn{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:14px;padding:3px 6px;border-radius:4px;}
    .wv-del-btn:hover{background:var(--err-bg);color:var(--err);}

    /* Toast */
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:8px 18px;font-size:12px;color:var(--tx);opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* 모바일은 PC와 동일한 레이아웃을 그대로 축소해서 보여주고 핀치줌으로 확인하는 방식이라
       위 리플로우는 쓰지 않음. 조회 전용 모드에서는 편집/추가/삭제/저장류만 숨기거나 잠근다. */
    html.view-only .adm-only { display: none !important; }
    html.view-only .tbl-wrap input,
    html.view-only .tbl-wrap .lock-icon,
    html.view-only .cs-row input {
      pointer-events: none !important;
      background: transparent !important;
      border-color: transparent !important;
      color: inherit !important;
    }
    html.view-only .cs-edit-btn,
    html.view-only .cs-del-btn,
    html.view-only .wv-del-btn { display: none !important; }
  </style>
</head>
<body>
<!-- 삽입 모드에서는 관리자 PIN을 다시 묻지 않는다 — 바깥 앱에서 이미 통과했다. -->
<script>if(!document.documentElement.classList.contains('embed')){
  var _ag=document.createElement('script'); _ag.src='/report/admin-gate.js'; document.head.appendChild(_ag);
}</script>
<script>
(function(){
  if(/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)) document.documentElement.classList.add('view-only');
})();
</script>

<header>
  <div class="hdr">
    <div class="hdr-title"><img src="icon-mark.png" alt=""/>공정관리 <small id="hdrProjectCompany"></small></div>
    <div class="flex1"></div>
  </div>
</header>
<div class="tab-bar">
  <div class="tab-nav">
    <button class="tab-btn on" id="tbtn-proc"  onclick="showTab('proc')"><i class="ti ti-chart-bar"></i> 공정률</button>
    <button class="tab-btn"   id="tbtn-check" onclick="showTab('check')"><i class="ti ti-checklist"></i> CHECK LIST</button>
  </div>
  <div class="flex1"></div>

  <div id="hdr-proc" class="adm-only" style="display:flex;gap:6px;align-items:center">
    <div id="hdr-sub-qty" style="display:flex;gap:6px;align-items:center">
      <span id="qty-manual-controls" style="display:none;gap:6px;">
        <label class="btn"><i class="ti ti-table-import"></i> 계획 CSV<input type="file" class="file-inp" accept=".csv" onchange="handleProcCSV(this)"></label>
        <label class="btn btn-green"><i class="ti ti-file-import"></i> 일보 가져오기<input type="file" class="file-inp" accept=".json" onchange="handleJSONImport(this)"></label>
      </span>
    </div>
  </div>
  <div id="hdr-check" class="adm-only" style="display:none;gap:6px;align-items:center">
    <span id="hdr-check-edit" style="display:none;gap:6px;align-items:center;">
      <label class="btn"><i class="ti ti-table-import"></i> CSV 업로드<input type="file" class="file-inp" accept=".csv" onchange="handleCheckCSV(this)"></label>
      <div class="hdr-sep"></div>
      <button class="btn btn-green" onclick="syncCheckToProc()"><i class="ti ti-refresh"></i> 공정률 반영</button>
    </span>
  </div>
</div>

<!-- ══ 공정률 ══════════════════════════════════════════════ -->
<div class="page" id="page-proc">
  <!-- 공정률은 작업물량(입력 수량) 하나로만 본다(2026-08-10, 사용자 확정) — CHECK LIST와 같이
       서브탭 없이 한 화면이다. 수기로 계획을 넣던 옛 "작업물량" 표(proc-sub-vol)는 삭제했다.
       여기 표가 작업일보 관리자 화면의 공정률과 같은 규칙으로 집계된 그 물량이다. -->
  <div id="proc-sub-qty">
    <div class="ctrl" id="qty-legacy-ctrl" style="display:none">
      <span class="ctrl-lbl">전일 기준일</span>
      <input type="date" class="date-inp" id="prev-date" onchange="calcAll()">
      <span class="ctrl-lbl">금일</span>
      <input type="date" class="date-inp" id="today-date" onchange="calcAll()">
      <button class="btn btn-sm" onclick="setToday()"><i class="ti ti-calendar-today"></i> 오늘</button>
      <div class="ctrl-sep"></div>
      <div class="import-status" id="import-status"><i class="ti ti-circle-x"></i> 일보 미연동</div>
    </div>
    <div class="ctrl" id="qty-sync-ctrl">
      <div class="import-status" id="sync-status" style="display:none"></div>
      <div class="flex1"></div>
      <button class="btn btn-sm" id="syncRefreshBtn" onclick="loadReportProgressData()"><i class="ti ti-refresh"></i> 새로고침</button>
    </div>
    <div class="tbl-wrap">
      <table style="min-width:840px">
        <thead><tr>
          <th class="lft" style="width:160px">작업분류</th>
          <th style="width:52px">단위</th><th style="width:90px">계획수량</th>
          <th style="width:72px">전일누계</th><th style="width:72px">금일</th><th style="width:72px">누계</th>
          <th style="width:80px">설치(엑셀)</th>
          <th style="width:110px">공정률</th><th style="width:58px">FACTOR</th>
        </tr></thead>
        <tbody id="proc-tbody"></tbody>
        <tfoot id="proc-tfoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<!-- ══ Check List ══════════════════════════════════════════ -->
<div class="page hidden" id="page-check">
  <!-- CHECK LIST는 날짜만 본다(2026-08-10, 사용자 확정) — 작업일보 관리자 화면의 Check List와
       같은 기준이다. 수량을 넣던 "작업물량" 서브탭은 여기서 뺐다(데이터·코드는 남아 있으므로
       필요하면 이 버튼만 되살리면 된다). -->
  <!-- 상단 줄은 하나로 합쳤다(2026-08-11) — 예전엔 안내문·검색·필터가 각각 한 줄씩 차지해
       표가 시작되기까지 네 줄이 밀려 있었다. 편집용 칸(TAG 추가)은 작업일보와 동기화된

async function loadReportProgressData(){
  if(!sbClient){ reportSynced=false; updateSyncStatus(); setSyncUI(false); renderTable(); return false; }
  var btn=document.getElementById('syncRefreshBtn');
  if(btn) btn.classList.add('spin');
  try{
    var settingsRes = await sbClient.from('app_settings').select('cats_by_menu,item_unit,plan_qty,install_qty,cat_factor').eq('id','global').single();
    var reportsRes = await sbClient.from('daily_reports').select('date,items');
    if(reportsRes.error || !reportsRes.data){ reportSynced=false; updateSyncStatus(); setSyncUI(false); renderTable(); return false; }
    var catsByMenu = (settingsRes.data && settingsRes.data.cats_by_menu) || {};
    var itemUnit = (settingsRes.data && settingsRes.data.item_unit) || {};
    var planQty = (settingsRes.data && settingsRes.data.plan_qty) || {};
    var installQty = (settingsRes.data && settingsRes.data.install_qty) || {};
    var catFactor = (settingsRes.data && settingsRes.data.cat_factor) || {};

    var seen={}, catList=[];
    (catsByMenu['시공']||[]).forEach(function(cat){ if(!seen[cat]){ seen[cat]=1; catList.push(cat); } });

    var today=new Date();
    var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    /* 작업일보 관리자 화면(admin.html aggregateProcVol)과 같은 규칙으로 집계한다
       (2026-08-10 — 예전엔 여기만 날짜별로 그냥 더해서, 같은 기기번호가 진행→완료로 여러 날
       입력되면 전일누계와 금일에 두 번 잡혔다).

       집계 대상은 "물량(입력 수량)"이고, 중복만 막는다: (분류,기기번호)별로 모든 날짜의
       수량을 먼저 합산한 뒤 그 합계 전체를 최초 입력일이 속한 구간 한 곳에만 넣는다.
       기기번호가 없는 항목은 개별 식별이 안 되므로 등장한 날짜 그대로 각각 합산한다. */
    var catToday={}, catBefore={};
    function addTo(isToday, cat, q){
      var target=isToday?catToday:catBefore;
      target[cat]=(target[cat]||0)+q;
    }
    var byKey={};
    reportsRes.data.forEach(function(row){
      (row.items||[]).forEach(function(it){
        if(!it || !it.cat || it.menu!=='시공' || !it.tag) return;
        var key=it.cat+'|'+it.tag;
        if(!byKey[key]) byKey[key]={cat:it.cat, qty:0, firstDate:row.date};
        var g=byKey[key];
        g.qty += (Number(it.qty)||0)*connectionQtyWeight(it.cat, it.spec);
        if(row.date<g.firstDate) g.firstDate=row.date;
      });
    });
    Object.keys(byKey).forEach(function(key){
      var g=byKey[key];
      var isToday=g.firstDate===todayStr, isBefore=g.firstDate<todayStr;
      if(isToday || isBefore) addTo(isToday, g.cat, g.qty);
    });
    reportsRes.data.forEach(function(row){
      var isToday=row.date===todayStr, isBefore=row.date<todayStr;
      if(!isToday && !isBefore) return;
      (row.items||[]).forEach(function(it){
        if(!it || !it.cat || it.menu!=='시공' || it.tag) return; // 기기번호 있는 건 위에서 처리
        addTo(isToday, it.cat, (Number(it.qty)||0)*connectionQtyWeight(it.cat, it.spec));
      });
    });
    catList.forEach(function(cat){ if(!(cat in catToday)) catToday[cat]=0; if(!(cat in catBefore)) catBefore[cat]=0; });
    // plan_qty/install_qty/cat_factor에만 있고 아직 일보 실적이 없는 분류도 놓치지 않는다(admin.html의 getCatList와 동일한 취지)
    [planQty, installQty].forEach(function(o){ Object.keys(o).forEach(function(cat){ if(!seen[cat]){ seen[cat]=1; catList.push(cat); } }); });

    procData = catList.map(function(cat){
      var before=catBefore[cat]||0, todayQ=catToday[cat]||0;
      var hasInstall=Object.prototype.hasOwnProperty.call(installQty,cat);
      var install=hasInstall?installQty[cat]:null;
      return {
        item:cat, unit:itemUnit[cat]||'EA',
        plan:planQty[cat]||0, prev:before, today:todayQ,
        install:install, hasInstall:hasInstall,
        factor:(catFactor[cat]!=null)?catFactor[cat]:1
      };
    });
    reportSynced=true; syncedAt=new Date();
    updateSyncStatus();
    setSyncUI(true);
    renderTable();
    return true;
  }catch(e){
    console.error('공정률 동기화 실패', e);
    reportSynced=false;
    updateSyncStatus();
    setSyncUI(false);
    renderTable();
    return false;
  }finally{
    if(btn) btn.classList.remove('spin');
  }
}

}

// ── IndexedDB ─────────────────────────────────────────────
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('ProcMgmtDB',3);
    req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e);
  });
}
function dbGet(k){return new Promise((res,rej)=>{const req=db.transaction('kv','readonly').objectStore('kv').get(k);req.onsuccess=e=>res(e.target.result);req.onerror=e=>rej(e);});}
function dbSet(k,v){return new Promise((res,rej)=>{const req=db.transaction('kv','readwrite').objectStore('kv').put(v,k);req.onsuccess=()=>res();req.onerror=e=>rej(e);});}

function calcFromReports(){
  const pd=document.getElementById('prev-date').value;
  const td=document.getElementById('today-date').value;
  procData.forEach(d=>{if(!d.prevLocked)d.prev=0;if(!d.todayLocked)d.today=0;});
  importedReports.forEach(r=>{
    const rd=r.date||'';
    (r.works||[]).forEach(w=>{
      const p=procData.find(d=>d.item===w.item);const act=parseFloat(w.act)||0;
      if(!p||!act)return;
      if(pd&&rd<=pd){if(!p.prevLocked)p.prev+=act;}
      else if(rd<=td){if(!p.todayLocked)p.today+=act;}
    });
  });
}
function calcVolFromReports(){
  const _pdEl=document.getElementById('vol-prev-date'), _tdEl=document.getElementById('vol-today-date');
  if(!_pdEl||!_tdEl) return;   // 작업물량 표 삭제됨
  const pd=_pdEl.value;
  const td=_tdEl.value;
  procVolData.forEach(d=>{if(!d.prevLocked)d.prev=0;if(!d.todayLocked)d.today=0;});
  importedVolReports.forEach(r=>{
    const rd=r.date||'';
    (r.works||[]).forEach(w=>{
      const p=procVolData.find(d=>d.item===w.item);const act=parseFloat(w.act)||0;
      if(!p||!act)return;
      if(pd&&rd<=pd){if(!p.prevLocked)p.prev+=act;}
      else if(rd<=td){if(!p.todayLocked)p.today+=act;}
    });
  });
}

/* FACTOR = 작업분류가 전체 공정에서 차지하는 비중(예: 공사비 기준 가중치, 기본값 1) — 각 분류의
   진행률(%) 자체는 FACTOR와 무관하게 그대로 보여주고, "합계"(전체 공정률)만 이 비중으로 진짜
   가중평균한다: Σ(진행률×FACTOR)/Σ(FACTOR). 예전엔 행마다 %에 FACTOR를 곱해서 보여주고 그 값들을
   단순평균했는데, 그건 가중평균이 아니라서 공사비 비중처럼 쓰기엔 틀린 계산이었음(2026-08-01 정정,
   report/app/admin.html에 먼저 반영한 것과 동일한 수정을 여기도 적용). */
function procActual(d){
  return d.hasInstall ? (d.install||0) : (d.prev+d.today);
}

function renderFooter(){

function setWrapHeight(){

  const top=wrap.getBoundingClientRect().top+(window.scrollY||document.documentElement.scrollTop||0);
  wrap.style.height=Math.max(300,window.innerHeight-top-16)+'px';

/* 가로축(작업분류) — 작업일보 ⚙️작업분류 설정(app_settings.cats_by_menu['시공'])을 그대로 쓴다.
   report/app/admin.html의 renderChecklist()와 같은 규칙(2026-08-11):
     1) 설정에 있는 시공 분류를 설정 순서 그대로 전부 열로 만든다 — 아직 실적이 없어도 열은 보인다.
        (예전엔 progress_checklist에 실적이 있는 분류만 열로 만들어서, 일보에서 새로 추가한 분류가
         여기선 아예 안 보였고 열 순서도 코드에 박힌 PROC_ITEMS 순서라 일보와 달랐다.)
     2) 설정에서 이미 지워졌지만 과거 데이터가 남은 분류는 뒤에 이어붙여 숨기지 않는다.
     3) 단위는 app_settings.item_unit(일보 ⚙️수량 단위 관리)에서 읽는다 — 코드에 박힌 PROC_ITEMS의
        단위와 일보 설정이 어긋나던 항목들(DCS PANEL·CABLE TRAY·SCAFFOLDING 등)이 이걸로 정리된다.
   PROC_ITEMS(코드에 박힌 20개)는 서버를 못 읽었을 때의 기본 열로만 남긴다. */
var settingsCatList=[], settingsItemUnit={};
function sikongCatsFrom(catsByMenu){
  var seen={}, list=[];
  ((catsByMenu||{})['시공']||[]).forEach(function(cat){
    if(seen[cat]) return;
    seen[cat]=true; list.push(cat);
  });
  return list;
}
async function loadCatSettings(){
  if(!sbClient) return false;
  try{
    var res=await sbClient.from('app_settings').select('cats_by_menu,item_unit').eq('id','global').single();
    settingsItemUnit=(res.data && res.data.item_unit) || {};
    settingsCatList=sikongCatsFrom(res.data && res.data.cats_by_menu);
    return settingsCatList.length>0;
  }catch(e){ console.error('작업분류 목록 불러오기 실패', e); return false; }
}
/* 작업일보에서 분류를 추가/이름변경/순서변경하거나 단위를 바꾸면 새로고침 없이 바로 따라간다 —
   report/app/admin.html의 subscribeAdminSettingsRealtime과 같은 테이블·같은 필터. */
function subscribeSettingsRealtime(){
  if(!sbClient || !sbClient.channel) return;
  sbClient.channel('app_settings_changes_progress')
    .on('postgres_changes',{event:'*',schema:'public',table:'app_settings',filter:'id=eq.global'},function(payload){
      if(!payload.new) return;
      settingsItemUnit=payload.new.item_unit || {};
      settingsCatList=sikongCatsFrom(payload.new.cats_by_menu);
      rebuildCheckCols();
    })
    .subscribe();
}

let syncedCheckCols=[], checkCatSeen={};
/* 설정 목록 + 데이터에만 남은 분류를 합쳐 열 정의를 다시 만든다. checkCatSeen은 서버에서 받은
   progress_checklist 행에 실제로 등장한 시공 분류들(loadChecklistFromSupabase가 채운다). */
function rebuildCheckCols(){
  if(!checkSynced) return;
  var cats=settingsCatList.slice(), seen={};
  cats.forEach(function(c){ seen[c]=true; });
  Object.keys(checkCatSeen).sort().forEach(function(c){ if(!seen[c]){ seen[c]=true; cats.push(c); } });
  syncedCheckCols=cats.map(function(c){ return {item:c, unit:settingsItemUnit[c]||''}; });
  rebuildFilterSelect(); buildCsHeader(); applyFilter();
  setWrapHeight();   // 동기화 안내문·필터바 높이가 바뀌었을 수 있으니 다시 바닥에 맞춘다
}
function getCheckCols(){
  if(checkSynced && syncedCheckCols.length) return syncedCheckCols;
  return PROC_ITEMS;
}

/* progress_checklist를 읽어 TAG NO.×작업분류 표로 만든다. 셀 값은 완료일자(complete_date)만
   — 작업일보 관리자 화면의 Check List와 같다. 완료 전(진행만 올라온) 기기는 행은 생기지만
   그 칸은 비어 있다. 실패하면 checkSynced=false로 두어 예전 수기 데이터를 그대로 보여준다. */
async function loadChecklistFromSupabase(){
  const note=document.getElementById('ck-sync-note');
  if(!sbClient){ if(note) note.textContent='⚠️ 서버 연결 실패 — 이 브라우저에 저장된 예전 값'; setCheckEditUI(false); return false; }
  try{
    const res=await sbClient.from('progress_checklist').select('tag,cat,menu,complete_date').order('tag');
    if(res.error||!res.data) throw new Error(res.error?res.error.message:'no data');
    const byTag={};
    checkCatSeen={};
    res.data.forEach(r=>{
      if(!r.tag) return;
      // progress_checklist에는 공종 구분 없이 전부 들어있다 — 시공 행만 쓴다(화기/유도·자재 등의
      // 분류가 시공용 체크리스트에 섞여 나오던 문제, admin.html이 2026-08-06에 먼저 고친 규칙).
      if(r.menu!=='시공') return;
      if(!byTag[r.tag]) byTag[r.tag]={tagNo:r.tag, qty:{}, note:''};
      if(r.cat){
        checkCatSeen[r.cat]=1;
        if(r.complete_date) byTag[r.tag].qty[r.cat]=String(r.complete_date).slice(0,10);
      }
    });
    checkQtyData=Object.keys(byTag).sort().map(t=>byTag[t]);
    checkSynced=true;
    if(activeCheckSub==='qty') checkData=checkQtyData;
    if(note) note.textContent=`✓ 작업일보 동기화 · TAG ${checkQtyData.length.toLocaleString()}건 · 조회 전용`;
    setCheckEditUI(true);
    // 열(작업분류)은 작업일보 ⚙️설정 순서 그대로 + 데이터에만 남은 분류를 뒤에 붙여 만든다.
    rebuildCheckCols();
    return true;
  }catch(e){
    console.error('Check List 동기화 실패', e);
    checkSynced=false;
    if(note) note.textContent='⚠️ 불러오기 실패 — 이 브라우저에 저장된 예전 값';
    setCheckEditUI(false);
    return false;
  }
}

/* 작업일보와 동기화된 동안에는 TAG 추가·CSV 업로드·공정률 반영이 전부 막혀 있다(눌러도
   "편집할 수 없습니다" 안내만 뜬다). 화면에 남겨두면 자리만 차지하므로 감춘다. */
function setCheckEditUI(synced){
  var edit=document.getElementById('ck-edit-ctrl');
  if(edit) edit.style.display = synced ? 'none' : 'inline-flex';
  var hdr=document.getElementById('hdr-check-edit');
  if(hdr) hdr.style.display = synced ? 'none' : 'inline-flex';
}
function switchCheckSub(sub){
  activeCheckSub=sub;
  checkData=sub==='qty'?checkQtyData:checkVolData;
  var bq=document.getElementById('ck-sbtn-qty'), bv=document.getElementById('ck-sbtn-vol');
  if(bq) bq.classList.toggle('on',sub==='qty');
  if(bv) bv.classList.toggle('on',sub==='vol');
  rebuildFilterSelect();
  buildCsHeader();
  applyFilter();
}

function rebuildFilterSelect(){
  const sel=document.getElementById('cs-filter-item');
  sel.innerHTML='<option value="">전체</option>';
  getCheckCols().forEach(p=>{
    const opt=document.createElement('option');
    opt.value=p.item;
    // 단위는 작업일보 설정값(item_unit)이라 비어 있을 수 있다 — 그땐 괄호를 안 붙인다.
    opt.textContent=p.unit?`${ABBR[p.item]||p.item} (${p.unit})`:(ABBR[p.item]||p.item);
    sel.appendChild(opt);
  });
}

function initCheckSheet(){
  rebuildFilterSelect();
  buildCsHeader();applyFilter();
  const wrap=document.getElementById('cs-wrap');
  wrap.addEventListener('scroll',()=>{
    if(scrollRaf)cancelAnimationFrame(scrollRaf);
    scrollRaf=requestAnimationFrame(()=>vsRender(wrap));
  });
}

function buildCsHeader(){
  const cols=getCheckCols();
  document.getElementById('cs-hdr').innerHTML=
    `<div class="cs-hdr-cell cs-col-tag lft">TAG NO.</div>`+
    cols.map(p=>`<div class="cs-hdr-cell" style="width:${W_ITEM}px;min-width:${W_ITEM}px" title="${p.item}${p.unit?' ('+p.unit+')':''}">${ABBR[p.item]||p.item}</div>`).join('')+
    `<div class="cs-hdr-cell" style="width:${W_NOTE}px;min-width:${W_NOTE}px">비고</div>`+
    `<div class="cs-hdr-cell" style="width:${W_DEL}px;min-width:${W_DEL}px"></div>`;
}

function applyFilter(){
  const q=(document.getElementById('cs-search')?.value||'').toLowerCase();
  const fi=document.getElementById('cs-filter-item')?.value||'';
  const fs=document.getElementById('cs-filter-status')?.value||'';
  filteredCheck=checkData.filter(r=>{
    if(q&&!r.tagNo.toLowerCase().includes(q))return false;
    if(!fi||!fs)return true;
    const filled=(parseFloat((r.qty||{})[fi])||0)>0;
    if(fs==='입력됨')return filled;
    if(fs==='미입력')return !filled;
    return true;
  });
  const badge=document.getElementById('filter-badge');
  badge.textContent=(fi||fs)?`${filteredCheck.length.toLocaleString()}개 표시`:'';
  const wrap=document.getElementById('cs-wrap');
  wrap.scrollTop=0;vsRender(wrap);
}
function resetFilter(){
  document.getElementById('cs-filter-item').value='';
  document.getElementById('cs-filter-status').value='';
  applyFilter();
}

function vsRender(wrap){
  const scrollTop=wrap.scrollTop,clientH=wrap.clientHeight||500;
  const total=filteredCheck.length;
  const start=Math.max(0,Math.floor(scrollTop/ROW_H)-BUFFER);
  const end=Math.min(total,Math.ceil((scrollTop+clientH)/ROW_H)+BUFFER);
  vsStart=start;vsEnd=end;
  document.getElementById('cs-st').style.height=(start*ROW_H)+'px';
  document.getElementById('cs-sb').style.height=((total-end)*ROW_H)+'px';
  document.getElementById('cs-vis').innerHTML=renderRows(start,end);
}

function renderRows(start,end){
  const cols=getCheckCols();
  return filteredCheck.slice(start,end).map(row=>{
    const ri=checkData.indexOf(row);
    const tagCell=ri===editingRi
      ?`<div class="cs-col-tag"><input class="cs-tag-edit-inp" value="${escHtml(row.tagNo)}" onblur="saveEditTag(${ri},this.value)" onkeydown="if(event.key==='Enter')this.blur();else if(event.key==='Escape')cancelEditTag()"></div>`
      :`<div class="cs-col-tag" title="${row.tagNo}">${row.tagNo}</div>`;
    return`<div class="cs-row">
      ${tagCell}
      ${cols.map(p=>renderCell(ri,p.item)).join('')}
      <div class="cs-col-note">${checkSynced
        ? `<span class="cs-qty-txt" style="font-size:11px">${escHtml(row.note||'')}</span>`
        : `<input class="cs-note-inp" value="${escHtml(row.note||'')}" placeholder="비고" onchange="checkData[${ri}].note=this.value">`}</div>
      <!-- 작업일보에서 받아온 목록은 TAG를 여기서 고치거나 지울 수 없다(서버에 안 올라간다). -->
      <div class="cs-col-del">${checkSynced ? '' : `
        <button class="cs-edit-btn" onclick="startEditTag(${ri})" title="수정"><i class="ti ti-pencil"></i></button>
        <button class="cs-del-btn" onclick="deleteTagRow(${ri})" title="삭제"><i class="ti ti-trash"></i></button>`}
      </div>
    </div>`;
  }).join('');
}

function renderCell(ri,item){
  const isQty=activeCheckSub==='qty';
  const rawVal=(checkData[ri].qty||{})[item];
  const S=`style="width:${W_ITEM}px;min-width:${W_ITEM}px"`;
  if(isQty){
    const dateStr=parseExcelDate(String(rawVal||'').trim());
    const hasVal=dateStr.length>0;
    // 작업일보에서 받아온 목록은 여기서 고치지 않는다(고쳐봐야 서버에 안 올라가고
    // 다음 새로고침에 사라진다) — 관리자 화면 Check List와 같은 조회 전용이다.
    if(!editMode || checkSynced){
      if(hasVal)return`<div class="cs-col-item has-val" ${S}><span class="cs-qty-txt" style="font-size:11px">${dateStr.slice(0,10)}</span></div>`;
      return`<div class="cs-col-item" ${S}></div>`;
    }
    return`<div class="cs-col-item${hasVal?' has-val':''}" ${S}>
      <input type="date" class="cs-qty-inp" style="width:80px;font-size:10px" value="${dateStr}"
        onchange="setQty(${ri},'${item}',this.value)" onblur="setQty(${ri},'${item}',this.value)">
    </div>`;
  }
  const val=parseFloat(rawVal)||0;
  return`<div class="cs-col-item${val>0?' has-val':''}" ${S}>
    <input type="number" min="0" class="cs-qty-inp" value="${val||''}" placeholder="0"
      onchange="setQty(${ri},'${item}',this.value)" onblur="setQty(${ri},'${item}',this.value)">
  </div>`;
}

function setQty(ri,item,val){
  if(!checkData[ri].qty)checkData[ri].qty={};
  checkData[ri].qty[item]=activeCheckSub==='qty'?(parseExcelDate(val)||''):(parseFloat(val)||0);
  const wrap=document.getElementById('cs-wrap');
  vsRender(wrap);
  syncCheckToProc(true);
}

function addTagRow(){
  // 작업일보에서 받아온 목록은 여기서 바꾸지 않는다 — 서버(progress_checklist)가 원본이다.
  if(checkSynced){ showToast('작업일보와 동기화된 목록이라 여기서 편집할 수 없습니다'); return; }
  const inp=document.getElementById('cs-new-tag');
  const tag=inp.value.trim().toUpperCase();
  if(!tag){showToast('TAG NO.를 입력하세요');return;}
  if(checkData.find(r=>r.tagNo===tag)){showToast('이미 존재하는 TAG입니다');return;}
  checkData.push({tagNo:tag,qty:{},note:''});
  inp.value='';
  applyFilter();
  const wrap=document.getElementById('cs-wrap');
  wrap.scrollTop=Math.max(0,(filteredCheck.length-1)*ROW_H);
  vsRender(wrap);
  showToast(`✓ ${tag} 추가`);
}

function deleteTagRow(ri){
  // 작업일보에서 받아온 목록은 여기서 바꾸지 않는다 — 서버(progress_checklist)가 원본이다.
  if(checkSynced){ showToast('작업일보와 동기화된 목록이라 여기서 편집할 수 없습니다'); return; }
  if(!confirm(`[${checkData[ri].tagNo}] 삭제하시겠습니까?`))return;
  checkData.splice(ri,1);applyFilter();syncCheckToProc(true);
}

function startEditTag(ri){
  editingRi=ri;vsRender(document.getElementById('cs-wrap'));
  setTimeout(()=>{const inp=document.querySelector('.cs-tag-edit-inp');if(inp)inp.focus();},0);
}
function saveEditTag(ri,val){
  if(skipSave)return;
  editingRi=-1;
  const tag=val.trim().toUpperCase();
  if(!tag||tag===checkData[ri].tagNo){applyFilter();return;}
  if(checkData.some((r,i)=>r.tagNo===tag&&i!==ri)){showToast('이미 존재하는 TAG입니다');applyFilter();return;}
  checkData[ri].tagNo=tag;applyFilter();showToast(`✓ ${tag} 수정 완료`);
}
function cancelEditTag(){
  skipSave=true;editingRi=-1;vsRender(document.getElementById('cs-wrap'));skipSave=false;
}
function toggleEditMode(){
  editMode=!editMode;
  const btn=document.getElementById('btn-edit-mode');
  if(btn){
    if(editMode){btn.innerHTML='<i class="ti ti-pencil-off"></i> 수정 중';btn.classList.add('btn-primary');}
    else{btn.innerHTML='<i class="ti ti-edit"></i> 전체 수정';btn.classList.remove('btn-primary');}
  }
  vsRender(document.getElementById('cs-wrap'));
}

// Check List CSV
function handleCheckCSV(input){
  // 작업일보에서 받아온 목록은 여기서 바꾸지 않는다 — 서버(progress_checklist)가 원본이다.
  if(checkSynced){ showToast('작업일보와 동기화된 목록이라 여기서 편집할 수 없습니다'); return; }
  const f=input.files[0];if(!f)return;
  showToast('업로드 처리 중...');
  const r=new FileReader();
  r.onload=e=>{
    const cols_def=getCheckCols();
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    if(lines.length<2){showToast('⚠️ 데이터 없음');return;}
    const hdrs=lines[0].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    let count=0;const CHUNK=500;let i=1;
    function processChunk(){
      const end=Math.min(i+CHUNK,lines.length);
      for(;i<end;i++){
        const cols=lines[i].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
        const tag=cols[0];if(!tag)continue;
        let row=checkData.find(r=>r.tagNo===tag);
        if(!row){row={tagNo:tag,qty:{},note:''};checkData.push(row);}
        hdrs.slice(1).forEach((h,hi)=>{
          const pItem=cols_def.find(p=>p.item===h||(ABBR[p.item]&&ABBR[p.item]===h));
          const v=cols[hi+1]??'';
          if(pItem){
            if(activeCheckSub==='qty') row.qty[pItem.item]=parseExcelDate(v.trim());
            else row.qty[pItem.item]=parseFloat(String(v).replace(/,/g,'').trim())||0;
          }else if(h==='비고'&&v)row.note=v;
        });
        count++;
      }
      if(i<lines.length){setTimeout(processChunk,0);}
      else{applyFilter();syncCheckToProc();saveData();showToast(`✓ ${count.toLocaleString()}개 TAG 업로드 완료 (공정률 자동 반영)`);}
    }
    processChunk();
  };
  r.readAsText(f,'UTF-8');input.value='';
}
function exportCheckCSV(){
  showToast('CSV 생성 중...');
  setTimeout(()=>{
    const cols=getCheckCols();
    const label=activeCheckSub==='qty'?'작업수량':'작업물량';
    const hdr=['TAG NO.',...cols.map(p=>p.item),'비고'].map(v=>`"${v}"`).join(',');
    const rows=checkData.map(r=>[r.tagNo,...cols.map(p=>(r.qty||{})[p.item]||0),r.note||''].map(v=>`"${v}"`).join(',')).join('\n');
    dl(`check_${label}_${today()}.csv`,'﻿'+hdr+'\n'+rows);
    showToast('✓ CSV 다운로드 완료');
  },50);
}

// Check → Proc sync
function syncCheckToProc(silent=false){
  /* 공정률이 작업일보와 동기화된 상태면 CHECK LIST 건수로 덮어쓰지 않는다(2026-08-10).
     예전엔 이 함수가 계획=TAG 건수, 전일/금일=날짜가 찍힌 TAG 수로 procData를 갈아치웠는데,
     지금 공정률은 관리자 화면과 같은 규칙으로 daily_reports에서 집계한 값이라 그걸 덮으면
     새로고침 전까지 엉뚱한 숫자가 보인다. */
  if(reportSynced){
    if(!silent) showToast('공정률은 작업일보와 자동 동기화됩니다 — 여기서 덮어쓰지 않습니다');
    return;
  }
  const todayDate=document.getElementById('today-date').value;
  const prevDate=todayDate?new Date(new Date(todayDate).getTime()-86400000).toISOString().slice(0,10):'';
  procData.forEach(d=>{
    if(!d.planLocked)d.plan=checkQtyData.length||0;
    if(!d.prevLocked)d.prev=checkQtyData.filter(r=>{const v=parseExcelDate(String((r.qty||{})[d.item]||'').trim());return v&&prevDate&&v<=prevDate;}).length;
    if(!d.todayLocked)d.today=checkQtyData.filter(r=>{const v=parseExcelDate(String((r.qty||{})[d.item]||'').trim());return v&&v===todayDate;}).length;
  });
  procVolData.forEach(d=>{
    const total=checkVolData.reduce((a,r)=>a+(parseFloat((r.qty||{})[d.item])||0),0);
    if(!d.planLocked)d.plan=total;
    d.today=Math.max(0,total-d.prev);
  });
  renderTable();
  renderVolTable();
  if(!silent)showToast('✓ 작업물량·작업수량 → 공정률 각각 반영 완료');
}

// ── 작업물량 ───────────────────────────────────────────────
function renderWorkTable(){
  document.getElementById('work-tbody').innerHTML=workData.map((w,i)=>{
    const cum=(w.prev||0)+(w.today||0);
    const pct=w.plan>0?Math.min(+(cum/w.plan*100).toFixed(1),100):0;
    const c=pctColor(pct);
    return`<tr>
      <td style="color:var(--tx2)">${i+1}</td>
      <td class="lft"><input class="wv-inp lft" value="${escHtml(w.work||'')}" placeholder="작업내용" onchange="workData[${i}].work=this.value"></td>
      <td><input class="wv-inp" style="width:54px;text-align:center" value="${escHtml(w.unit||'')}" placeholder="단위" onchange="workData[${i}].unit=this.value"></td>
      <td><input type="number" min="0" class="wv-inp" value="${w.plan||''}" placeholder="0" onchange="workData[${i}].plan=parseFloat(this.value)||0;renderWorkTable()"></td>
      <td><input type="number" min="0" class="wv-inp" value="${w.prev||''}" placeholder="0" onchange="workData[${i}].prev=parseFloat(this.value)||0;renderWorkTable()"></td>
      <td><input type="number" min="0" class="wv-inp" value="${w.today||''}" placeholder="0" onchange="workData[${i}].today=parseFloat(this.value)||0;renderWorkTable()"></td>
      <td class="wv-num">${cum>0?cum.toLocaleString():''}</td>
      <td>${w.plan>0?`<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${COLORS[i%COLORS.length]}"></div></div><span class="pct-val" style="color:${c}">${pct}%</span></div>`:'<span style="color:var(--tx2)">–</span>'}</td>
      <td><input class="wv-inp lft" value="${escHtml(w.note||'')}" placeholder="비고" onchange="workData[${i}].note=this.value"></td>
      <td><button class="wv-del-btn" onclick="deleteWorkRow(${i})" title="삭제"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join('');
  renderWorkFooter();
}
function renderWorkFooter(){
  const tp=workData.reduce((a,w)=>a+(w.plan||0),0);
  const tprev=workData.reduce((a,w)=>a+(w.prev||0),0);
  const ttod=workData.reduce((a,w)=>a+(w.today||0),0);
  const tcum=tprev+ttod;
  const pct=tp>0?Math.min(+(tcum/tp*100).toFixed(1),100):0;
  document.getElementById('work-tfoot').innerHTML=`<tr>
    <td colspan="3" class="lft" style="text-align:left">합 계</td>
    <td>${tp>0?tp.toLocaleString():''}</td>
    <td>${tprev>0?tprev.toLocaleString():''}</td>
    <td>${ttod>0?ttod.toLocaleString():''}</td>
    <td style="color:var(--ac2)">${tcum>0?tcum.toLocaleString():''}</td>
    <td style="color:${pctColor(pct)}">${tp>0?pct+'%':''}</td>
    <td colspan="2"></td>
  </tr>`;
}
function addWorkRow(){
  workData.push({work:'',unit:'',plan:0,prev:0,today:0,note:''});
  renderWorkTable();
}
function deleteWorkRow(i){
  if(!confirm('항목을 삭제하시겠습니까?'))return;
  workData.splice(i,1);renderWorkTable();
}
function syncWorkToProc(){
  workData.forEach(w=>{
    const pd=procData.find(d=>d.item===w.work);
    if(!pd)return;
    if(!pd.planLocked)pd.plan=w.plan||0;
    pd.prev=w.prev||0;
    pd.today=w.today||0;
  });
  renderTable();renderChart();
  showToast('✓ 작업물량 → 공정률 동기화 완료');
}
function handleWorkCSV(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    if(lines.length<2){showToast('⚠️ 데이터 없음');return;}
    let count=0;
    lines.forEach((line,i)=>{
      if(i===0)return;
      const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      if(!cols[0])return;
      workData.push({work:cols[0],unit:cols[1]||'',plan:parseFloat(cols[2])||0,prev:parseFloat(cols[3])||0,today:parseFloat(cols[4])||0,note:cols[5]||''});
      count++;
    });
    renderWorkTable();showToast(`✓ ${count}개 항목 업로드 완료`);
  };
  r.readAsText(f,'UTF-8');input.value='';
}
function exportWorkCSV(){
  const hdr='"작업내용","단위","계획수량","전일누계","금일수량","비고"\n';
  const rows=workData.map(w=>[w.work,w.unit,w.plan||0,w.prev||0,w.today||0,w.note||''].map(v=>`"${v}"`).join(',')).join('\n');
  dl(`작업물량_${today()}.csv`,'﻿'+hdr+rows);

}

// ── Helpers ───────────────────────────────────────────────
// 엑셀의 모든 날짜 형식을 YYYY-MM-DD 로 정규화
function parseExcelDate(val){
  if(val===null||val===undefined||val==='')return'';
  const s=String(val).trim();
  if(!s)return'';
  // 엑셀 시리얼 숫자 (예: 44927 → 2023-01-01)
  if(/^\d+(\.\d+)?$/.test(s)){
    const n=Math.floor(parseFloat(s));
    if(n>=30000&&n<2958466){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toISOString().slice(0,10);}
  }
  // YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD (구분자 -, /, . 모두 허용, 1~2자리 월/일 허용)
  let m=s.match(/^(\d{4})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})$/);
  if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // YYYY년 M월 D일 (한국어)
  m=s.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
  if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // DD/MM/YYYY 또는 DD.MM.YYYY 또는 DD-MM-YYYY (일 먼저, 4자리 년)
  m=s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
  if(m){
    const d=parseInt(m[1]),mo=parseInt(m[2]);
    if(d>12)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    if(mo>12)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  // YY-MM-DD 또는 YY/MM/DD 또는 YY.MM.DD (2자리 년)
  m=s.match(/^(\d{2})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})$/);
  if(m){const y=parseInt(m[1])>=50?'19'+m[1]:'20'+m[1];return`${y}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;}
  // DD-MMM-YY 또는 DD-MMM-YYYY (예: 15-Jan-24, 15-Jan-2024)
  const MON={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  m=s.match(/^(\d{1,2})[-\/\s]([A-Za-z]{3})[-\/\s](\d{2,4})$/);
  if(m){const mo=MON[m[2].toLowerCase()];if(mo){const y=m[3].length===2?(parseInt(m[3])>=50?'19'+m[3]:'20'+m[3]):m[3];return`${y}-${mo}-${m[1].padStart(2,'0')}`;}}
  return'';
}
function pctColor(p){return p>=100?'#3B6D11':p>=70?'#185FA5':p>=40?'#BA7517':'#A32D2D';}
function today(){return new Date().toISOString().slice(0,10);}
function setToday(){
  document.getElementById('today-date').value=today();
  document.getElementById('prev-date').value=new Date(Date.now()-86400000).toISOString().slice(0,10);
  calcAndRender();
}

    :`<i class="ti ti-circle-x" style="color:var(--tx2)"></i> 일보 미연동`;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300);}
function dl(name,content){
  const blob=new Blob([content],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

/* 바깥 앱(인원투입계획/실투입)이 공정률/CHECK LIST를 각각 자기 탭으로 두고 ?tab= 으로
   어느 쪽을 열지 알려준다. 탭을 바꿀 때는 부모가 showTab()을 직접 호출한다(같은 도메인). */
(function(){
  var m=/[?&]tab=(\w+)/.exec(location.search);
  if(m && (m[1]==='proc' || m[1]==='check')) showTab(m[1]);
})();
